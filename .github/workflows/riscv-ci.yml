name: RISC-V Cross-Compilation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [elmer, getdp, oofem, spooles, openblas, arpack]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install RISC-V toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu gfortran-riscv64-linux-gnu
    
    - name: Cross-compile package
      run: |
        echo "RISC-V CI workflow ready"
